name: 'Report a failed scheduled run'
description: >-
  Open an issue for a scheduled workflow run that has a failed job, or comment on the
  workflow's open issue if it has one (dev/varka_scheduled_failure.py holds the rule).
  A job counts when it failed or timed out, or when it was cancelled and its check-run
  annotations do not positively identify a deliberate cancel (a newer run replacing it, or a
  person); an unknown text, none, or an unreadable reply reports it, so a rewording on GitHub's
  side never drops a red night. If the jobs the caller needs failed but the run lists no
  failed job, the issue is still opened or updated.
  Run it as the last job of a scheduled workflow, after a checkout that includes dev/; it uses
  the job's own token (github.token), so the job needs the issues: write, actions: read and
  checks: read permissions. It closes nothing. If GitHub cannot be reached after three tries
  the report goes to the job summary and the job fails.
inputs:
  needs:
    description: >-
      toJSON(needs) of the calling job; the script takes failure from it if a needed job
      failed, so a run whose jobs listing shows no failed job is reported anyway.
    required: true
runs:
  using: composite
  steps:
    - name: Open or update the issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SHA: ${{ github.sha }}
        NEEDS: ${{ inputs.needs }}
      run: |
        python3 dev/varka_scheduled_failure.py --apply --repo "$REPO" \
          --workflow "$WORKFLOW" --run-url "$RUN_URL" --sha "$SHA" --run-id "$RUN_ID" \
          --needs-json "$NEEDS" --date "$(date -u +%F)"
