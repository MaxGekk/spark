# The option configuration matrix, every configuration (VARKA-248.md 3.2.8). The Varka suites
# rerun once per configuration - the emit defaults with one option changed, carried by every kernel
# they emit - fanned out (VARKA-507): one job builds the test classes and plans the bins, about a
# hundred jobs of eight minutes' work each run one bin of (configuration, module, suites) runner
# JVMs, at most 30 at a time, and one job merges their runs and reports, the declining check
# comparing every configuration's fused batches with the defaults' (dev/varka_matrix_bins.py). A
# bin that frees a slot hands it to the next, so a slow runner holds back only its own bin. A pull
# request runs one configuration in its varka-scoped jobs; this runs all of them once a week and
# on dispatch. See dev/varka_matrix.sh.
name: Varka option matrix

on:
  schedule:
    # Sunday 03:00 UTC, after the weekly full Spark matrix has started and before Monday's
    # pull requests.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Runner JVMs a bin runs at a time (dev/varka_matrix_bins.py --lanes)'
        required: false
        default: '2'

jobs:
  build:
    name: "Option matrix: build and plan"
    # Never on apache/spark, whose tree has no Varka; on this project's repositories always.
    if: github.repository != 'apache/spark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      bins: ${{ steps.plan.outputs.bins }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache SBT and Maven
      uses: actions/cache@v4
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
        restore-keys: |
          build-
    - name: Cache Coursier local repository
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: varka-option-matrix-coursier-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
        restore-keys: |
          varka-option-matrix-coursier-
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Install the Varka engine
      uses: ./.github/actions/install-varka-engine
    - name: Build the test classes
      run: ./dev/varka_matrix.sh --build-only --sbt-arg -Phive --out target/varka-matrix
    # The bins, from the configurations the build listed and each module's suites; one line of
    # the summary says how many and how long.
    - name: Plan the bins
      id: plan
      run: |
        set -o pipefail
        mkdir -p target/varka-bins
        for module in sql catalyst; do
          ./dev/varka_matrix.sh --list-suites --module "$module" > "target/varka-bins/$module"
        done
        python3 dev/varka_matrix_bins.py plan \
          --configurations target/varka-matrix/configurations \
          --suites sql=target/varka-bins/sql --suites catalyst=target/varka-bins/catalyst \
          --lanes "${{ inputs.lanes || '2' }}" \
          > target/varka-bins/bins.json 2> target/varka-bins/plan.txt
        cat target/varka-bins/plan.txt | tee -a "$GITHUB_STEP_SUMMARY"
        echo "bins=$(cat target/varka-bins/bins.json)" >> "$GITHUB_OUTPUT"
    # Every entry of the test classpath, the build's class directories and the dependencies' jars
    # alike, archived at its absolute path, which is the same on every runner, with the classpath
    # and JVM options the bins read.
    - name: Archive the classpath
      run: |
        set -o pipefail
        tr ':' '\n' < target/varka-matrix/classpath | grep -v '^$' \
          | while read -r e; do [ -e "$e" ] && echo "$e"; done > target/varka-bins/entries
        echo "$PWD/target/varka-matrix/classpath" >> target/varka-bins/entries
        echo "$PWD/target/varka-matrix/jvm.opts" >> target/varka-bins/entries
        tar -cPf target/varka-build.tar -T target/varka-bins/entries
        ls -l target/varka-build.tar
    - name: Upload the classpath
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-build
        path: target/varka-build.tar
        retention-days: 1
        compression-level: 1

  bins:
    name: "Option matrix: ${{ matrix.bin }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix: ${{ fromJSON(needs.build.outputs.bins) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    # The runner's CPU and the vector width HotSpot uses, before any kernel runs: the pool mixes
    # 256-bit and 512-bit machines, and a bin that fails on one and passes on the other has to be
    # read against the machine it ran on (VARKA-399).
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/varka-units/${{ matrix.bin }}/${{ matrix.bin }}-platform
    - name: Download the classpath
      uses: actions/download-artifact@v4
      with:
        name: varka-option-matrix-build
        path: target
    - name: Unpack the classpath
      run: tar -xPf target/varka-build.tar && rm target/varka-build.tar
    # Each unit is one runner JVM, two at a time on the runner's four cores and 16 GB unless the
    # dispatch asks for more, each in a directory of its own named by the bin, so that the report
    # job can merge every bin's runs. The memory in use is sampled every five seconds, and the
    # bin's peak recorded, since four cores could run more JVMs than 16 GB may hold.
    # The small-tree series at size 4, which pull requests no longer run (VARKA-269 9): every
    # configuration meets every tree to size 4, IfElse included.
    - name: Run this bin's units
      env:
        UNITS: ${{ matrix.units }}
        BIN: ${{ matrix.bin }}
        LANES: ${{ inputs.lanes || '2' }}
      run: |
        out=target/varka-units/$BIN
        mkdir -p "$out"
        while :; do free -m | awk '/^Mem:/ {print $3}'; sleep 5; done > "$out/$BIN-memory.log" &
        sampler=$!
        # The step's shell is bash -e: a unit's status is captured, so that a failing unit
        # neither ends the step before the others run nor goes unrecorded.
        run_unit() {
          local k=$1 config=$2 module=$3 suites=$4 mode status=0
          if [ "$config" = defaults ]; then mode=(--defaults); else mode=(--config "$config"); fi
          ./dev/varka_matrix.sh --skip-build --build-dir target/varka-matrix --runs-only \
            --out "$out/$BIN-u$k" --leaf-suffix "$BIN-$k" --module "$module" --suites "$suites" \
            "${mode[@]}" --jvm-arg -Dvarka.series.size=4 > "$out/$BIN-u$k.log" 2>&1 || status=$?
          echo "$status" > "$out/$BIN-u$k.exit"
        }
        k=0 running=0 units=()
        while IFS='|' read -r config module suites; do
          [ -n "$config" ] || continue
          run_unit "$k" "$config" "$module" "$suites" &
          units+=($!)
          k=$((k + 1)) running=$((running + 1))
          # The sampler never ends, so the next job to end is a unit.
          if [ "$running" -ge "$LANES" ]; then wait -n || true; running=$((running - 1)); fi
        done <<< "$UNITS"
        # Each unit by its id, since a bare wait would wait for the sampler too.
        for p in "${units[@]}"; do wait "$p" || true; done
        kill "$sampler" || true
        echo "peak memory in use: $(sort -n "$out/$BIN-memory.log" | tail -1) MB of" \
          "$(free -m | awk '/^Mem:/ {print $2}') MB, $LANES JVMs at a time" \
          | tee "$out/$BIN-memory.txt"
        status=0
        for f in "$out"/*-u*.exit; do
          if [ "$(cat "$f")" != 0 ]; then
            echo "== ${f%.exit}.log:"; tail -40 "${f%.exit}.log"; status=1
          fi
        done
        exit "$status"
    - name: Upload the bin's runs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-${{ matrix.bin }}
        path: |
          target/varka-units/${{ matrix.bin }}/*-platform/platform.txt
          target/varka-units/${{ matrix.bin }}/*-memory.txt
          target/varka-units/${{ matrix.bin }}/*-u*.log
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/name
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/exit
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/seconds
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/run.log
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/fused.tsv
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/junit/*.xml
        if-no-files-found: ignore
        retention-days: 30

  report:
    name: "Option matrix: report"
    needs: [build, bins]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Download every bin's runs
      uses: actions/download-artifact@v4
      with:
        pattern: varka-option-matrix-b[0-9]*
        path: target/varka-bins
        merge-multiple: true
    # Every unit's runs/ into one: a configuration's directory gathers the JVM directories of all
    # its units, which their bin names keep apart; the report then reads one run of the matrix.
    - name: Merge the runs
      run: |
        mkdir -p target/varka-merged/runs
        for runs in target/varka-bins/*-u*/runs; do
          cp -r "$runs"/. target/varka-merged/runs/
        done
        echo "sql catalyst" > target/varka-merged/runs/modules
    - name: Report
      run: |
        set -o pipefail
        ./dev/varka_matrix.sh --report-only target/varka-merged | tee target/varka-matrix-report.txt
    - name: Summary
      if: always()
      run: |
        {
          echo "## Option matrix"
          echo '```'
          sed -n '/^configuration/,$p' target/varka-matrix-report.txt 2>/dev/null || echo "no report"
          echo '```'
          # The machines the bins ran on, so that an unfused line can be read against them.
          echo "Bins by CPU:"
          echo '```'
          grep -h '^CPU' target/varka-bins/*-platform/platform.txt | sort | uniq -c || true
          echo '```'
          # The bins' peak memory in use, the highest five, against the runner's.
          echo "Peak memory of the bins, the highest five:"
          echo '```'
          grep -H . target/varka-bins/*-memory.txt 2>/dev/null | sed 's#^.*/##' \
            | sort -t: -k3 -n | tail -5 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    # The suites' seconds under the defaults, from this run's JUnit reports, for the next plan's
    # weights (sql/varka/matrix/suite-seconds.tsv).
    - name: Suite seconds
      if: always()
      run: |
        python3 dev/varka_matrix_bins.py times target/varka-merged/runs \
          > target/suite-seconds.tsv
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-report
        path: |
          target/varka-matrix-report.txt
          target/suite-seconds.tsv
        if-no-files-found: ignore
        retention-days: 30

  report-failure:
    name: Report a failed run
    # Only a scheduled run, since a person who dispatches one sees its result; only on the
    # project's own repository, where issues are on; and when a job failed or was cancelled.
    # The script lists every failed, timed-out or cancelled job, a cancelled one with a note.
    needs: [build, bins, report]
    if: >-
      always() && github.event_name == 'schedule' && github.repository == 'vecbricks/varka'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          dev
    - name: Report the failure
      uses: ./.github/actions/report-scheduled-failure
      with:
        needs: ${{ toJSON(needs) }}
