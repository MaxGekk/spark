# Run one of Varka's canary programs (dev/varka_canary/*.java) on each runner
# architecture the pool offers, and print what it says beside what machine it
# ran on. A canary is a single-file Java program that answers a question about
# the JVM and the hardware - whether a conversion intrinsifies, whether the
# vector math lanes agree with the scalar library - and the answer is a property
# of the host, so it has to be asked on every host class the project ships to.
# This workflow is the cheap way to ask: no Spark build, one JDK, seconds per
# runner. It enforces nothing; a result is read from the job log and recorded
# in the plan or the canary's own header by hand.
name: Varka canary

on:
  # A push that touches a canary runs the default one, so a new probe answers on both
  # architectures before it is merged. Dispatch is for asking a question again later; it
  # is only offered once this file is on the default branch, which is GitHub's rule.
  push:
    paths:
      - 'dev/varka_canary/**'
      - '.github/workflows/varka-canary.yml'
  workflow_dispatch:
    inputs:
      canary:
        description: 'The class under dev/varka_canary to run, e.g. MathLaneProbe'
        required: true
        default: 'MathLaneProbe'
      args:
        description: 'Arguments to pass to its main'
        required: false
        default: ''

jobs:
  canary:
    name: "${{ inputs.canary || 'MathLaneProbe' }} on ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout Varka
      uses: actions/checkout@v6
      with:
        sparse-checkout: dev/varka_canary
    - name: Install JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Describe the machine
      env:
        CANARY: ${{ inputs.canary || 'MathLaneProbe' }}
      # The whole feature line, from the kernel and from the JVM: a filtered list hides the
      # entries that decide what C2 may emit, such as aarch64's svebitperm, which
      # VectorMask.fromLong needs to become a single VectorLongToMask node.
      run: |
        mkdir -p "$RUNNER_TEMP/canary-out"
        echo "## $CANARY on ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
        {
          echo '```'
          grep -m1 -E 'model name|^CPU part|^Model' /proc/cpuinfo || true
          grep -m1 -E '^(flags|Features)' /proc/cpuinfo || true
          java -Xlog:os+cpu -version 2>&1 | grep -F '[os,cpu]' || true
          java -version 2>&1 | head -1
          echo '```'
        } | tee "$RUNNER_TEMP/canary-out/machine.txt" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Run the canary
      env:
        CANARY: ${{ inputs.canary || 'MathLaneProbe' }}
        ARGS: ${{ inputs.args || '' }}
      # The vector debug property makes the JDK name the math library it bound each operator
      # to (SVML, SLEEF or the Java fallback) and the symbol, which is the evidence that a
      # lane result came from the library rather than from a per-lane scalar call. Its
      # CPUFeatures line is the JVM's own feature list and is kept. For the math probe a
      # second pass forces the fallback: it is the control the library pass is read against,
      # in time per element and in which lanes differ. A third pass runs the probe's
      # VectorMask.fromLong loop under PrintIntrinsics; the log keeps the lines that say
      # whether fromBitsCoerced was intrinsified, and the artifact keeps every pass whole.
      run: |
        out="$RUNNER_TEMP/canary-out"
        # probe <title> <file> <JVM flags> <program args> [<regex of lines to show>]
        # $3 and $4 are split into words on purpose.
        # shellcheck disable=SC2086
        probe() {
          echo "### $1"
          echo '```'
          java --add-modules jdk.incubator.vector -Djdk.incubator.vector.DEBUG=true $3 \
            "dev/varka_canary/${CANARY}.java" $4 > "$out/$2.txt" 2>&1 \
            || echo "exit status $?" >> "$out/$2.txt"
          grep -v 'WARNING: Using incubator' "$out/$2.txt" | grep -E -- "${5:-.}" \
            | sed -E 's/ \(cpu features:.*//'
          echo '```'
        }
        {
          probe "vector math library" library "" "${ARGS}"
          if [ "$CANARY" = MathLaneProbe ]; then
            probe "control: per-lane scalar fallback forced" control \
              -Djdk.incubator.vector.VectorMathLibrary=java "${ARGS}"
            probe "VectorMask.fromLong under PrintIntrinsics" fromlong \
              "-XX:+UnlockDiagnosticVMOptions -XX:+PrintIntrinsics" fromlong \
              'fromBitsCoerced|\*\* |LongToMask|^arch=|^DEBUG: (CPUFeatures|AArch64|X64)|^exit'
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Keep the raw output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: canary-${{ inputs.canary || 'MathLaneProbe' }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/canary-out
