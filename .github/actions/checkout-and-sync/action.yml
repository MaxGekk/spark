name: 'Checkout and Sync'
description: >-
  Check out apache/spark at a pinned ref and, on forks, squash-merge the fork
  branch on top so the build tests the combined result. Callers must add a
  bare 'actions/checkout' step before invoking this action so that the latest
  action definition is present in the workspace.
inputs:
  ref:
    description: 'Git ref to check out from apache/spark'
    required: true
  set-safe-directory:
    description: 'Add GITHUB_WORKSPACE to git safe.directory (needed inside containers)'
    required: false
    default: 'false'
  base-repository:
    description: >-
      The repository whose branch pull requests are opened against. Change
      detection diffs against this rather than against apache/spark, so a pull
      request is measured by its own diff instead of by the fork's entire
      divergence from upstream. Set to '' to restore the upstream behaviour.
    required: false
    default: 'vecbricks/varka'
  base-ref:
    description: "Branch of base-repository to use as the change-detection base"
    required: false
    default: 'master'
outputs:
  head_sha:
    description: 'The apache/spark HEAD SHA checked out (before the fork merge)'
    value: ${{ steps.resolve-sha.outputs.head_sha }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Spark repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        repository: apache/spark
        ref: ${{ inputs.ref }}
    - name: Add GITHUB_WORKSPACE to git trust safe.directory
      if: inputs.set-safe-directory == 'true'
      shell: bash
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: Resolve apache/spark HEAD SHA
      id: resolve-sha
      shell: bash
      run: echo "head_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
    # Change detection asks "what did this pull request change", and answers it with
    # `git diff $APACHE_SPARK_REF HEAD`. On apache/spark those are the same question. On a
    # long-lived fork they are not: apache/spark's HEAD is missing everything the fork has ever
    # added, so every pull request looks like it changed all of it - 193 files here, 16 of which
    # match no module and therefore select the `root` module, which means "test everything".
    # Squash-merging the fork's own base branch first, and pointing APACHE_SPARK_REF at that,
    # makes the diff the pull request's own.
    - name: Establish the change-detection base
      id: base
      if: >-
        github.repository != 'apache/spark' && inputs.base-repository != ''
        && github.ref != format('refs/heads/{0}', inputs.base-ref)
      shell: bash
      run: |
        git fetch --no-tags https://github.com/${{ inputs.base-repository }}.git \
          ${{ inputs.base-ref }}
        git \
          -c user.name='Apache Spark Test Account' \
          -c user.email='sparktestacc@gmail.com' \
          merge --no-commit --progress --squash FETCH_HEAD
        git \
          -c user.name='Apache Spark Test Account' \
          -c user.email='sparktestacc@gmail.com' \
          commit -m "Base ${{ inputs.base-repository }}/${{ inputs.base-ref }}" --allow-empty
        echo "APACHE_SPARK_REF=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "base_established=true" >> $GITHUB_OUTPUT
    - name: Sync the current branch with the latest in Apache Spark
      if: github.repository != 'apache/spark'
      shell: bash
      run: |
        # Only when the step above did not already set it: it must stay the *base* commit, not
        # apache/spark's HEAD, or the diff widens back out to the fork's whole divergence.
        if [ "${{ steps.base.outputs.base_established }}" != "true" ]; then
          echo "APACHE_SPARK_REF=$(git rev-parse HEAD)" >> $GITHUB_ENV
        fi
        git fetch https://github.com/$GITHUB_REPOSITORY.git ${GITHUB_REF#refs/heads/}
        git \
          -c user.name='Apache Spark Test Account' \
          -c user.email='sparktestacc@gmail.com' \
          merge --no-commit --progress --squash FETCH_HEAD
        git \
          -c user.name='Apache Spark Test Account' \
          -c user.email='sparktestacc@gmail.com' \
          commit -m "Merged commit" --allow-empty
